<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui; }
    body { margin: 0; background: #f8fafc; display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #fff; width: 100%; max-width: 480px; padding: 28px; border-radius: 18px; box-shadow: 0 10px 40px rgba(0,0,0,.08); }
    input, select, textarea { width: 100%; padding: 12px; margin: 6px 0; border: 1.5px solid #e2e8f0; border-radius: 10px; }
    button { width: 100%; padding: 13px; background: #000; color: #fff; border: none; border-radius: 10px; font-weight: 700; margin-top: 10px; cursor: pointer; }
    #status { display: none; margin-top: 12px; padding: 12px; border-radius: 10px; font-weight: 600; text-align: center; }
    .ok { display: block!important; background: #dcfce7; color: #14532d; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Get a free quote</h2>
    <form id="form">
      <input id="name" placeholder="Full Name *" required>
      <input id="company" placeholder="Company Name *" required>
      <input id="phone" placeholder="Phone *" required>
      <input id="email" type="email" placeholder="Work Email *" required>
      <select id="service">
        <option>Web Development</option>
        <option>Mobile App</option>
        <option>UI/UX Design</option>
        <option>IT Consulting</option>
      </select>
      <textarea id="message" placeholder="Message"></textarea>
      <button id="btn" type="submit">Submit Enquiry →</button>
    </form>
    <div id="status"></div>
  </div>

  <script>
    const CONFIG = {
      SHEET_URL: "https://sheetbest.com",
      BUSINESS_EMAIL: "meescooby@gmail.com" // Your business inbox
    };

    document.getElementById('form').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const btn = document.getElementById('btn');
      const status = document.getElementById('status');
      
      const name = document.getElementById('name').value.trim();
      const company = document.getElementById('company').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const email = document.getElementById('email').value.trim();
      const requirement = document.getElementById('service').value;
      const message = document.getElementById('message').value.trim() || "No message";

      const currentIST = new Date().toLocaleString("en-IN", {
        timeZone: "Asia/Kolkata", dateStyle: "medium", timeStyle: "medium"
      });

      const templateParams = { name, company, phone, email, requirement, message, date: currentIST };

      // 1. Log to Google Sheets (Runs silently in background)
      try {
        fetch(CONFIG.SHEET_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(templateParams)
        });
      } catch (err) { console.warn("Sheet update skipped"); }

      // 2. Draft Mail Handler
      const emailSubject = encodeURIComponent(`New Inquiry from ${name} (${company})`);
      const emailBody = encodeURIComponent(
        `Hello,\n\nYou have received a new website submission:\n\n` +
        `Name: ${name}\n` +
        `Company: ${company}\n` +
        `Phone: ${phone}\n` +
        `Client Email: ${email}\n` +
        `Requirement: ${requirement}\n` +
        `Date (IST): ${currentIST}\n\n` +
        `Message:\n${message}`
      );

      // Launches user's native device mail app with everything typed out
      window.location.href = `mailto:${CONFIG.BUSINESS_EMAIL}?subject=${emailSubject}&body=${emailBody}`;

      // 3. UI Confirmation State
      status.className = "ok";
      status.innerText = "✅ Form recorded! Mail client opened.";
      status.style.display = "block";
      
      e.target.reset();
    });
  </script>

</body>
</html>
