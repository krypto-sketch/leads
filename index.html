<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#f8fafc;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;width:100%;max-width:480px;padding:28px;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.08)}
input,select,textarea{width:100%;padding:12px;margin:6px 0;border:1.5px solid #e2e8f0;border-radius:10px}
button{width:100%;padding:13px;background:#000;color:#fff;border:none;border-radius:10px;font-weight:700;margin-top:10px;cursor:pointer}
#status{display:none;margin-top:12px;padding:12px;border-radius:10px;font-weight:600;text-align:center}
.ok{display:block!important;background:#dcfce7;color:#14532d} .err{display:block!important;background:#fee2e2;color:#7f1d1d}
</style>
</head>
<body>
<div class="card">
<h2>Get a free quote</h2>
<form id="form">
<input id="name" placeholder="Full Name *" required>
<input id="company" placeholder="Company Name *" required>
<input id="phone" placeholder="Phone *" required>
<input id="email" type="email" placeholder="Work Email *" required>
<select id="service"><option>Web Development</option><option>Mobile App</option><option>UI/UX Design</option><option>IT Consulting</option></select>
<textarea id="message" placeholder="Message"></textarea>
<button id="btn" type="submit">Send Enquiry →</button>
</form>
<div id="status"></div>
</div>

<script>
const CONFIG = {
  SHEET_URL: "https://sheetbest.com", // Restored your SheetBest endpoint ID
  SERVICE_ID: "service_t34juym",
  PUBLIC_KEY: "xLTipM6Y5jthRtrtU",
  OWNER_TEMPLATE_ID: "owner_notification", // Your exact owner template ID
  COMPANY_NAME: "Nexora Solutions"
};

// Initialize EmailJS
emailjs.init(CONFIG.PUBLIC_KEY);

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const btn = document.getElementById('btn');
  const status = document.getElementById('status');
  
  btn.disabled = true; 
  btn.innerText = "Sending..."; 
  status.style.display = "none";

  // Force strict Indian Standard Time (IST) formatting
  const currentIST = new Date().toLocaleString("en-IN", {
    timeZone: "Asia/Kolkata",
    dateStyle: "medium",
    timeStyle: "medium"
  });

  const data = {
    name: document.getElementById('name').value.trim(),
    company: document.getElementById('company').value.trim(),
    phone: document.getElementById('phone').value.trim(),
    email: document.getElementById('email').value.trim(),
    requirement: document.getElementById('service').value, 
    message: document.getElementById('message').value.trim() || "No message",
    date: currentIST, // Strict IST Time
    company_name: CONFIG.COMPANY_NAME
  };

  try {
    // 1. Log to your Google Sheet asynchronously
    fetch(CONFIG.SHEET_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });

    // 2. Trigger the primary EmailJS template
    await emailjs.send(CONFIG.SERVICE_ID, CONFIG.OWNER_TEMPLATE_ID, data);

    status.className = "ok"; 
    status.innerText = "✅ Sent! Application submitted successfully.";
    status.style.display = "block";
    e.target.reset();

  } catch (err) {
    status.className = "err"; 
    status.innerText = "❌ " + (err.text || JSON.stringify(err)); 
    status.style.display = "block";
  }

  btn.disabled = false; 
  btn.innerText = "Send Enquiry →";
});
</script>
</body>
</html>
