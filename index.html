<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora Solutions - Contact</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
* {box-sizing: border-box; font-family: 'Inter', sans-serif;}
body {margin: 0; background: #f5f7ff; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;}
.card {background: white; width: 100%; max-width: 500px; padding: 32px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.08);}
h2 {margin: 0 0 6px 0; font-size: 24px;}
.sub {color: #666; font-size: 14px; margin-bottom: 20px;}
input, select, textarea {width: 100%; padding: 12px 14px; margin: 7px 0; border: 1.5px solid #e5e7eb; border-radius: 10px; font-size: 14px; outline: none; transition: 0.2s;}
input:focus, select:focus, textarea:focus {border-color: #000;}
textarea {min-height: 80px; resize: none;}
button {width: 100%; padding: 14px; margin-top: 12px; background: #000; color: #fff; border: none; border-radius: 10px; font-weight: 600; font-size: 15px; cursor: pointer;}
button:disabled {opacity: 0.6;}
#status {display: none; margin-top: 16px; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 600; text-align: center;}
.success {display: block !important; background: #dcfce7; color: #166534; border: 1px solid #bbf7d0;}
.error {display: block !important; background: #fee2e2; color: #991b1b; border: 1px solid #fecaca;}
</style>
</head>
<body>
<div class="card">
<h2>Let's talk about your project</h2>
<p class="sub">Fill the form, we reply in 12 hours.</p>
<form id="leadForm">
<input id="name" placeholder="Full Name *" required>
<input id="company" placeholder="Company Name *" required>
<input id="phone" placeholder="Phone / WhatsApp *" required>
<input id="email" type="email" placeholder="Work Email *" required>
<select id="service"><option value="Web Development">Web Development</option><option value="Mobile App Development">Mobile App Development</option><option value="UI/UX Design">UI/UX Design</option><option value="IT Consulting">IT Consulting</option></select>
<textarea id="message" placeholder="Tell us about your project..."></textarea>
<button id="btn" type="submit">Send Enquiry →</button>
</form>
<div id="status"></div>
</div>

<script>
// --- YOUR FINAL KEYS - 100% READY ---
const SHEET_URL = "https://api.sheetbest.com/sheets/843141df-865c-4ec3-b558-7e8289c9da38";
const SERVICE_ID = "service_t34juym";
const PUBLIC_KEY = "xLTipM6Y5jthRtrtU";
const OWNER_TEMPLATE_ID = "template_2757mhb";
const CUSTOMER_TEMPLATE_ID = "template_8r0oazi";
const OWNER_EMAIL = "meescooby@gmail.com";
const COMPANY_NAME = "Nexora Solutions";

emailjs.init(PUBLIC_KEY);

document.getElementById('leadForm').addEventListener('submit', async (e)=>{
e.preventDefault();
const btn = document.getElementById('btn');
const status = document.getElementById('status');
const originalText = btn.innerText;
btn.innerText = "Sending..."; btn.disabled = true;
status.style.display = "none";

const formData = {
name: document.getElementById('name').value.trim(),
company: document.getElementById('company').value.trim(),
phone: document.getElementById('phone').value.trim(),
email: document.getElementById('email').value.trim(),
service: document.getElementById('service').value,
message: document.getElementById('message').value.trim() || "No message provided",
to_email: OWNER_EMAIL,
company_name: COMPANY_NAME,
date: new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' })
};

try {
// 1. Save to Google Sheet (don't wait for it)
fetch(SHEET_URL, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(formData) }).catch(()=>{});

// 2. Send LEAD to YOU (Owner)
await emailjs.send(SERVICE_ID, OWNER_TEMPLATE_ID, formData);

// 3. Send THANK YOU to CUSTOMER
await emailjs.send(SERVICE_ID, CUSTOMER_TEMPLATE_ID, {
...formData,
to_email: formData.email
});

status.className = "success";
status.innerText = "✅ Done! Lead saved + Email sent to you + Thank you sent to customer";
status.style.display = "block";
e.target.reset();
} catch (err) {
status.className = "error";
status.innerText = "❌ Failed: " + (err.text || JSON.stringify(err));
status.style.display = "block";
console.error(err);
}
btn.innerText = originalText; btn.disabled = false;
});
</script>
</body>
</html>
